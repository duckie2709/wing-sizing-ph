<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1520" viewBox="0 0 1920 1520" role="img" aria-labelledby="title desc">
<title id="title">Sơ đồ giải thuật tính S, cr, ct bằng mô hình Polhamus–Helmbold</title>
<desc id="desc">Ba phần nối bằng các ký hiệu A và B: kiểm tra dữ liệu và tính dòng tới; giải phương trình bậc hai theo aspect ratio; lọc nghiệm, thế ngược lực và xuất kết quả. Mọi nghiệm hợp lệ đều được trả về.</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#334e62"/></marker>
<marker id="failArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#8e3f36"/></marker>
</defs>
<rect width="1920" height="1520" fill="white"/>
<g font-family="Times New Roman, serif">
<text x="960" y="48.0" font-size="36" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#172b3a">
<tspan x="960" dy="0">SƠ ĐỒ GIẢI THUẬT TÍNH S, cr VÀ ct</tspan>
</text>
<text x="960" y="92.0" font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#172b3a">
<tspan x="960" dy="0">Polhamus–Helmbold • Giải bậc hai theo aspect ratio A • Đối chiếu với app và MATLAB</tspan>
</text>
<path d="M635 140 V1360" stroke="#d5dee4" stroke-width="1.4"/>
<path d="M1285 140 V1360" stroke="#d5dee4" stroke-width="1.4"/>
<text x="310" y="152.0" font-size="29" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#172b3a">
<tspan x="310" dy="0">1  Dữ liệu và dòng tới</tspan>
</text>
<text x="960" y="152.0" font-size="29" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#172b3a">
<tspan x="960" dy="0">2  Giải phương trình theo AR</tspan>
</text>
<text x="1610" y="152.0" font-size="29" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#172b3a">
<tspan x="1610" dy="0">3  Kiểm nghiệm và xuất kết quả</tspan>
</text>
